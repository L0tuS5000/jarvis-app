<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#10233b"/>
      <stop offset="1" stop-color="#050912"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#c8f9ff"/>
      <stop offset=".55" stop-color="#3ee6ff"/>
      <stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#3ee6ff" stroke-opacity=".35"/>
  <g filter="url(#glow)" fill="none" stroke="#3ee6ff" stroke-linecap="round">
    <!-- outer segmented ring: 5 arcs, one per agent -->
    <circle cx="128" cy="128" r="88" stroke-width="10" stroke-dasharray="94.5 16" transform="rotate(-82 128 128)"/>
    <!-- inner dashed ring -->
    <circle cx="128" cy="128" r="66" stroke-width="7" stroke-opacity=".55" stroke-dasharray="22 12"/>
    <!-- core ring -->
    <circle cx="128" cy="128" r="44" stroke-width="5"/>
  </g>
  <circle cx="128" cy="128" r="40" fill="url(#core)"/>
  <!-- triangle reactor detail -->
  <path d="M128 104 L149 140 L107 140 Z" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="4" stroke-linejoin="round"/>
</svg>
